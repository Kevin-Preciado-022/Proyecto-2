<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recorrido de Ruta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #ecf0f1;
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
    }

    button {
      margin: 5px;
      padding: 10px 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animada {
      animation: aparecer 0.4s ease-out;
    }
  </style>
</head>
<body>
  <h1>Recorrido de Ruta</h1>

  <div>
    <button onclick="recorrerAdelante()">Recorrer Adelante</button>
    <button onclick="recorrerAtras()">Recorrer Atrás</button>
    <button onclick="moverDesde(2)">Mover desde parada 3</button>
  </div>

  <ul id="recorrido"></ul>

  <script>
    class Nodo {
      constructor(valor) {
        this.valor = valor;
        this.siguiente = null;
        this.anterior = null;
      }
    }

    class ListaDoblementeEnlazada {
      constructor() {
        this.inicio = null;
        this.fin = null;
      }

      agregar(valor) {
        const nuevo = new Nodo(valor);
        if (!this.inicio) {
          this.inicio = this.fin = nuevo;
        } else {
          this.fin.siguiente = nuevo;
          nuevo.anterior = this.fin;
          this.fin = nuevo;
        }
      }

      recorrerAdelante() {
        const resultado = [];
        let actual = this.inicio;
        while (actual) {
          resultado.push(actual.valor);
          actual = actual.siguiente;
        }
        return resultado;
      }

      recorrerAtras() {
        const resultado = [];
        let actual = this.fin;
        while (actual) {
          resultado.push(actual.valor);
          actual = actual.anterior;
        }
        return resultado;
      }

      moverDesde(indice) {
        const resultado = [];
        let actual = this.inicio;
        let i = 0;
        while (actual && i < indice) {
          actual = actual.siguiente;
          i++;
        }
        while (actual) {
          resultado.push(actual.valor);
          actual = actual.siguiente;
        }
        return resultado;
      }
    }

    const ruta = new ListaDoblementeEnlazada();
    ruta.agregar("Terminal Norte");
    ruta.agregar("Estación Central");
    ruta.agregar("Parque del Río");
    ruta.agregar("Universidad");
    ruta.agregar("Terminal Sur");

    function renderizar(lista) {
      const ul = document.getElementById("recorrido");
      ul.innerHTML = "";
      lista.forEach(nombre => {
        const li = document.createElement("li");
        li.textContent = nombre;
        li.classList.add("animada");
        ul.appendChild(li);
      });
    }

    function recorrerAdelante() {
      renderizar(ruta.recorrerAdelante());
    }

    function recorrerAtras() {
      renderizar(ruta.recorrerAtras());
    }

    function moverDesde(indice) {
      renderizar(ruta.moverDesde(indice));
    }
  </script>
</body>
</html>
